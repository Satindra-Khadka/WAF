services:
  juice-shop:
    image: bkimminich/juice-shop
    ports:
      - "3001:3000"
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: waf
      POSTGRES_PASSWORD: waf_dev_password
      POSTGRES_DB: waf
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: